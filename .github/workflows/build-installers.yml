name: Build Multi-Platform Desktop Installers (DMG & EXE)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac-arm64:
    name: Build macOS DMG (Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Python Dependencies & PyInstaller
        run: |
          uv sync
          uv add pyinstaller

      - name: Compile Standalone Python Sidecar Binary
        run: |
          uv run python scripts/build_sidecar.py

      - name: Build Dashboard & Package DMG
        working-directory: dashboard
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx electron-builder --mac dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StockWave-macOS-arm64
          path: dashboard/dist-electron/*.dmg

  build-windows:
    name: Build Windows EXE (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Python Dependencies & PyInstaller
        run: |
          uv sync
          uv add pyinstaller

      - name: Compile Standalone Python Sidecar Binary
        shell: bash
        run: |
          uv run python scripts/build_sidecar.py

      - name: Build Dashboard & Package NSIS EXE
        working-directory: dashboard
        shell: bash
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx electron-builder --win nsis

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StockWave-Windows-x64
          path: dashboard/dist-electron/*.exe

  publish-release:
    name: Publish GitHub Release
    needs: [build-mac-arm64, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release with DMG & EXE
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StockWave-macOS-arm64/*.dmg
            StockWave-Windows-x64/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false

